# Monthly, grouped update PRs (decided in #12). Security alerts still arrive immediately.
# Gradle is not listed: app/android is generated by `expo prebuild`, and its libraries come
# with React Native and the Expo SDK, which are upgraded together (see the npm ignores below).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    labels: [chore, 'area: ci']

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Patch releases within the Expo SDK (expo, expo-*, @expo/*) go together.
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*']
        update-types: [patch]
      everything-else:
        patterns: ['*']
        exclude-patterns: ['expo', 'expo-*', '@expo/*', 'react', 'react-native']
    ignore:
      # These move only with an Expo SDK upgrade (`npx expo install --fix`): React Native's
      # "minor" versions are breaking, and the SDK pins the matching React.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    labels: [chore, 'area: phone']

  - package-ecosystem: nuget
    directory: /pc/gui
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    labels: [chore, 'area: pc']
