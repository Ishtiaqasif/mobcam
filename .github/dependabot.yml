# Monthly, grouped update PRs (decided in #12). Security alerts still arrive immediately, and
# security updates aren't affected by the ignore rules below.
# Gradle is not listed: app/android is generated by `expo prebuild`, and its libraries come
# with React Native and the Expo SDK, which are upgraded together (see the npm ignores below).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    labels: [chore, 'area: ci']

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Patch releases within the Expo SDK (expo, expo-*, @expo/*) go together.
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*']
        update-types: [patch]
      everything-else:
        patterns: ['*']
        exclude-patterns: ['expo', 'expo-*', '@expo/*', 'react', 'react-native']
    ignore:
      # These move only with an Expo SDK upgrade (`npx expo install --fix`): React Native's
      # "minor" versions are breaking, and the SDK pins the matching React.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # The SDK pins the exact React and React Native versions (SDK 58: react 19.3.0), so not
      # even patches come separately (#42, #57).
      - dependency-name: 'react-native'
      - dependency-name: 'react'
      # Majors wait until eslint-config-expo supports them: its plugins need ESLint <= 9 and its
      # TypeScript ESLint plugin needs TypeScript < 6.1 (#51, #57).
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    labels: [chore, 'area: phone']

  - package-ecosystem: nuget
    directory: /pc/gui
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    labels: [chore, 'area: pc']
