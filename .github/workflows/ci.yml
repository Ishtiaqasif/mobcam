name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: PC and phone versions match
        shell: pwsh
        run: ./scripts/check-versions.ps1
      - name: Build engine, virtual camera, CLI and app
        shell: pwsh
        run: ./pc/build.ps1

  android:
    name: Phone app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build release APK (unsigned check)
        working-directory: app/android
        run: ./gradlew assembleRelease --console=plain -PreactNativeArchitectures=arm64-v8a
