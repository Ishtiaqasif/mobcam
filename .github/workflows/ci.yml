name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # Windows, like the developers: dotnet format needs the WPF project, and line endings match.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: clang-format 19.1.5 (same version as Visual Studio 2022's)
        run: python -m pip install clang-format==19.1.5
      - uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('scripts/format.ps1') }}
      - run: npm ci
        working-directory: app
      - name: Formatting and lint (C++, C#, Kotlin, TypeScript)
        shell: pwsh
        run: ./scripts/format.ps1 -Check

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: PC and phone versions match
        shell: pwsh
        run: ./scripts/check-versions.ps1
      - name: Build everything and run the unit tests (stream parsing, picture processing, protocol v2)
        shell: pwsh
        run: ./pc/build.ps1 -Test

  android:
    name: Phone app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      # Fails if a new dependency has a licence the script can't place (scripts/notices.ps1)
      - name: Third-party notices
        shell: pwsh
        run: ../scripts/notices.ps1 -Target phone
      - name: Unit tests (SEI, lenses, protocol v2)
        working-directory: app/android
        run: ./gradlew :mobcam-stream:testDebugUnitTest --console=plain
      - name: Build release APK (unsigned check)
        working-directory: app/android
        run: ./gradlew assembleRelease --console=plain -PreactNativeArchitectures=arm64-v8a
